<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background linear gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Glowing accent gradient -->
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4A154B" />
      <stop offset="35%" stop-color="#611f69" />
      <stop offset="70%" stop-color="#2ea44f" />
      <stop offset="100%" stop-color="#238636" />
    </linearGradient>

    <!-- Title gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EC4899" />
      <stop offset="30%" stop-color="#A855F7" />
      <stop offset="70%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Card gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F2937" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glow filters -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.08); }
    }
    @keyframes floatPill1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes floatPill2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -40; }
    }
    .orb-glow {
      transform-origin: center;
      animation: pulseGlow 6s ease-in-out infinite;
    }
    .pill-1 {
      animation: floatPill1 4s ease-in-out infinite;
    }
    .pill-2 {
      animation: floatPill2 5s ease-in-out infinite;
    }
    .stream-line {
      stroke-dasharray: 6 6;
      animation: dashMove 2s linear infinite;
    }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .sub-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;
    }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="340" rx="16" fill="url(#bgGrad)" stroke="#374151" stroke-width="1.5" />

  <!-- Dynamic ambient background orbs (kept behind content) -->
  <circle cx="150" cy="170" r="130" fill="#611f69" opacity="0.3" class="orb-glow" filter="url(#neonGlow)" />
  <circle cx="1050" cy="170" r="140" fill="#238636" opacity="0.25" class="orb-glow" filter="url(#neonGlow)" style="animation-delay: -3s;" />

  <!-- Animated connection stream lines in background -->
  <path d="M 200 270 Q 400 310 600 275 T 1000 270" fill="none" stroke="#6366F1" stroke-width="2" opacity="0.4" class="stream-line" />
  <path d="M 220 70 Q 500 20 800 65 T 1020 70" fill="none" stroke="#10B981" stroke-width="1.5" opacity="0.35" class="stream-line" />

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1200" height="6" rx="3" fill="url(#glowGrad)" />

  <!-- Dynamic Floating Decorative Tags (Pills) -->
  <!-- Pill 1: Slack ChatOps -->
  <g class="pill-1" transform="translate(140, 52)">
    <rect width="130" height="34" rx="17" fill="#1F2937" stroke="#4A154B" stroke-width="1.5" opacity="0.95" />
    <circle cx="20" cy="17" r="5" fill="#E01E5A" />
    <text x="34" y="22" fill="#E5E7EB" class="badge-text">⚡ Slack Ops</text>
  </g>

  <!-- Pill 2: GitHub Actions & CI -->
  <g class="pill-2" transform="translate(930, 52)">
    <rect width="145" height="34" rx="17" fill="#1F2937" stroke="#238636" stroke-width="1.5" opacity="0.95" />
    <circle cx="20" cy="17" r="5" fill="#2EA44F" />
    <text x="34" y="22" fill="#E5E7EB" class="badge-text">🐙 GitHub Actions</text>
  </g>

  <!-- Foreground Main Branding (Clear, High Contrast, Centered) -->
  <g id="foreground-content">
    <!-- Main Headline -->
    <text x="600" y="145" text-anchor="middle" class="title-text" font-size="42" fill="url(#titleGrad)">
      Awesome Team Collaboration
    </text>

    <!-- Subheadline Primary -->
    <text x="600" y="195" text-anchor="middle" class="title-text" font-size="34" fill="#F9FAFB">
      Slack &amp; GitHub Integrations
    </text>

    <!-- Descriptive Subtitle -->
    <text x="600" y="235" text-anchor="middle" class="sub-text" font-size="16" fill="#9CA3AF" letter-spacing="0.3">
      Curated ChatOps Workflows • Webhooks • Bot Frameworks • AI Agents • Event Automation
    </text>
  </g>

  <!-- Bottom Interactive Floating Highlights -->
  <g transform="translate(320, 268)">
    <!-- Node 1 -->
    <rect x="0" y="0" width="160" height="36" rx="8" fill="url(#cardGrad)" stroke="#374151" stroke-width="1" />
    <text x="80" y="23" text-anchor="middle" class="badge-text" fill="#D1D5DB">💬 Real-time ChatOps</text>

    <!-- Node 2 -->
    <rect x="195" y="0" width="170" height="36" rx="8" fill="url(#cardGrad)" stroke="#374151" stroke-width="1" />
    <text x="280" y="23" text-anchor="middle" class="badge-text" fill="#D1D5DB">🔄 Bi-directional Sync</text>

    <!-- Node 3 -->
    <rect x="395" y="0" width="165" height="36" rx="8" fill="url(#cardGrad)" stroke="#374151" stroke-width="1" />
    <text x="477" y="23" text-anchor="middle" class="badge-text" fill="#D1D5DB">🤖 Autonomous Agents</text>
  </g>
</svg>
